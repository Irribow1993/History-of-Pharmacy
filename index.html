<style>
:root{--nav-h:calc(54px + env(safe-area-inset-bottom,0px));--panel-h:44vh;--head-h:52px;
 --bg1:#004c4c;--bg2:#004c4c;--bg:#004c4c;--line:#2f6b5e;--acc:#4be8ac;--acc2:#ffb238;--new:#ff3d7a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
html,body{margin:0;height:100%;min-height:100dvh;touch-action:manipulation;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;}
body{font-family:'M PLUS Rounded 1c',sans-serif;color:#eafff5;
 background:var(--bg);
 min-height:100%;min-height:100dvh;overflow-x:hidden;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.app{max-width:440px;margin:0 auto;position:relative;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));}
header{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;
 background:rgba(0,60,60,.94);backdrop-filter:blur(4px);border-bottom:1px solid rgba(120,255,220,.25);
 display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.res{flex:1;display:flex;gap:10px;font-size:.72rem;font-weight:700;}
.res .row{display:flex;flex-direction:column;} .res .row b{font-size:.82rem;color:#8dfad0;}
.res .row span{font-size:.58rem;color:#7fa89c;}
.stage{padding:6px 10px 2px;font-size:.68rem;color:#7fe3c4;text-align:center;letter-spacing:.05em;}
.tree-wrap{position:relative;width:100%;height:560px;margin-top:46px;}
svg.lines{position:absolute;top:0;left:0;width:100%;height:100%;}
svg.lines line{stroke:rgba(140,255,220,.3);stroke-width:2;vector-effect:non-scaling-stroke;}
svg.lines line.locked{stroke:rgba(255,255,255,.1);}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;--r:30px;transform:translate(-50%,calc(var(--r) * -1));
 text-align:center;cursor:pointer;background:none;border:none;padding:0;margin:0;color:inherit;font-family:inherit;}
.node::before{content:'';position:absolute;top:-6px;bottom:-4px;left:-8px;right:-8px;}
.node .circle{transition:transform .08s;}
.node:active .circle{transform:scale(.9);}
.node .label{white-space:nowrap;}
.node .circle{border-radius:50%;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 35% 30%,#1c4d44,#0a2622);border:2px solid var(--line);position:relative;}
.node.main{width:82px;--r:30px;} .node.main .circle{width:60px;height:60px;font-size:1.5rem;}
.node.main.active .circle{border:3px solid var(--acc);box-shadow:0 0 14px rgba(75,232,172,.7);}
.node.main.locked .circle{filter:grayscale(.7);opacity:.5;}
.node .label{font-size:.62rem;font-weight:700;margin-top:3px;}
.node .rate{font-size:.58rem;color:var(--acc);font-weight:700;}
.node.locked .label,.node.locked .rate{color:#5f746e;}
.node.up{width:56px;--r:20px;} .node.up .circle{width:40px;height:40px;font-size:1.1rem;border-width:1px;}
.node.up .label{font-size:.5rem;}
.node.ev{width:56px;--r:21px;} .node.ev .circle{width:42px;height:42px;font-size:1.1rem;}
.node.ev .label{font-size:.5rem;}
.badge{position:absolute;top:-5px;right:-4px;background:var(--acc2);color:#3a2400;font-size:.5rem;font-weight:900;
 border-radius:7px;padding:1px 4px;}
.badge.new{background:var(--new);color:#fff;transform:scale(0);}
.badge.new.show{animation:pop .35s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes pop{to{transform:scale(1);}}
.ring{position:absolute;top:50%;left:50%;border-radius:50%;border:2px solid var(--acc);
 transform:translate(-50%,-50%) scale(1);opacity:0;pointer-events:none;width:60px;height:60px;}
.ring.animate{animation:ringPulse 1.2s ease-out;}
@keyframes ringPulse{0%{opacity:.9;}100%{transform:translate(-50%,-50%) scale(2.1);opacity:0;}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(0,60,60,.97);
 border-top:1px solid rgba(120,255,220,.25);padding-bottom:env(safe-area-inset-bottom,0px);max-width:440px;margin:0 auto;}
nav button{flex:1;background:none;border:none;color:#7fa89c;padding:9px 0 7px;font-size:1.05rem;
 display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;}
nav button span{font-size:.58rem;font-weight:700;} nav button.active{color:var(--acc);}
.nav-dot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--new);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:-100%;z-index:30;max-width:440px;margin:0 auto;
 background:linear-gradient(#123832,#0a2622);border-top:2px solid var(--line);border-radius:18px 18px 0 0;
 padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transition:bottom .25s ease;box-shadow:0 -8px 24px rgba(0,0,0,.4);}
.sheet.show{bottom:0;}
.sheet{max-height:82vh;max-height:82dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.sheet .handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px;}
.sheet .head{display:flex;align-items:center;gap:10px;}
.sheet .head .icon{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c4d44,#0a2622);
 border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.sheet .head .title{font-weight:900;font-size:1rem;} .sheet .head .sub{font-size:.68rem;color:#7fa89c;}
.sheet .flavor{font-size:.7rem;color:#bfe8dc;line-height:1.6;margin:10px 0;border-left:3px solid var(--line);padding-left:8px;}
.sheet .stats{display:flex;justify-content:space-between;font-size:.72rem;margin:10px 0;background:#0a2622;border-radius:10px;padding:8px 12px;}
.sheet .stats div{text-align:center;} .sheet .stats b{display:block;color:#8dfad0;font-size:.82rem;}
.qty-tabs{display:flex;gap:6px;margin-bottom:10px;}
.qty-tabs button{flex:1;background:#0a2622;border:1px solid var(--line);color:#7fa89c;padding:6px 0;border-radius:8px;font-size:.7rem;font-weight:700;}
.qty-tabs button.active{background:#1c4d44;color:#8dfad0;border-color:var(--acc);}
.buy-btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:900;font-size:.88rem;
 background:linear-gradient(var(--acc),#2bb886);color:#032018;box-shadow:0 3px 0 #1c8a63;}
.buy-btn:disabled{background:#4a5a55;color:#8fa39c;box-shadow:0 3px 0 #2e3a36;}
.progress-mini{height:6px;background:#0a2622;border-radius:3px;overflow:hidden;margin:4px 0 10px;}
.progress-mini span{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),#ff7a3d);}
.close-btn{position:absolute;top:12px;right:14px;color:#7fa89c;font-size:1.1rem;background:none;border:none;}
.float-plus{position:fixed;z-index:60;color:var(--acc);font-weight:900;font-size:1rem;pointer-events:none;
 transform:translate(-50%,-50%);animation:floatUp .7s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%) translateY(0);}100%{opacity:0;transform:translate(-50%,-50%) translateY(-40px);}}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);
 max-width:400px;width:88%;background:linear-gradient(#123832,#0a2622);border:1px solid var(--acc);border-radius:12px;
 padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:40;box-shadow:0 6px 16px rgba(0,0,0,.4);
 transition:transform .4s cubic-bezier(.34,1.2,.5,1);}
.toast.show{transform:translate(-50%,0);}
.toast .icon{width:34px;height:34px;border-radius:50%;background:#1c4d44;border:1px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.toast .text b{display:block;font-size:.76rem;} .toast .text span{font-size:.6rem;color:#7fa89c;}
.disc-overlay{position:fixed;inset:0;background:rgba(2,8,6,.85);z-index:50;display:flex;align-items:center;justify-content:center;
 opacity:0;pointer-events:none;transition:opacity .3s;}
.disc-overlay.show{opacity:1;pointer-events:auto;}
.disc-card{width:88%;max-width:360px;max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:linear-gradient(#16463d,#08211c);border:2px solid var(--acc);border-radius:20px;
 padding:26px 20px 22px;text-align:center;transform:scale(.6);opacity:0;transition:transform .4s cubic-bezier(.34,1.4,.5,1),opacity .3s;
 box-shadow:0 0 30px rgba(75,232,172,.35);}
.disc-overlay.show .disc-card{transform:scale(1);opacity:1;}
.disc-card .tag{font-size:.62rem;color:var(--acc2);font-weight:900;letter-spacing:.08em;}
.disc-card .portrait{width:92px;height:92px;margin:14px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a6659,#0a2622);
 border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:0 0 22px rgba(75,232,172,.6);}
.disc-card .name{font-size:1.1rem;font-weight:900;margin-bottom:6px;}
.disc-card .quote{font-size:.74rem;color:#c9e6dd;line-height:1.75;margin-bottom:14px;text-align:left;}

@keyframes sway{
 0%,100%{translate:-1.5px 1px;rotate:-2.5deg;}
 50%{translate:1.5px calc(var(--ay,4px) * -1);rotate:2.5deg;}
}

.spk::before{content:'';position:absolute;left:calc(var(--s) * -1.1);top:calc(var(--s) * -1.1);width:calc(var(--s) * 2.2);height:calc(var(--s) * 2.2);
 border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 70%);opacity:.65;}
.spk::after{content:'';position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);
 background:radial-gradient(circle,#fff 25%,var(--c) 100%);
 clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);}
@keyframes spk{
 0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0deg);}
 15%{opacity:1;transform:translate(calc(var(--dx) * .35),calc(var(--dy) * .35)) scale(1.15) rotate(60deg);}
 100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 16px)) scale(.1) rotate(220deg);}
}

<script>
const GENS = [
 {id:'kusa', name:'薬草採集小屋', icon:'🌿', x:200,y:60, baseCost:10, baseProd:.1, unlockAt:0,
  flavor:'人類は文字をもつはるか以前から、植物の薬効を経験で知っていた。文字記録では、紀元前2100年ごろのシュメールの粘土板に処方が残り、紀元前1550年ごろのエジプトのエーベルス・パピルスには700を超える薬や処方が記される。薬の歴史は、まず野山で「採る」ことから始まった。',
  ups:[{name:'粘土板調合書',n:0,flavor:'現存最古級の処方箋は、紀元前2100年ごろのシュメールの都市ニップルから出た粘土板とされる。楔形文字で薬材とその調合法が記され、植物・鉱物・動物由来の素材が並ぶ。この板には呪文の記載がなく、経験にもとづく薬の記録として知られる。'},
       {name:'ディオスコリデス『マテリア・メディカ』',n:1,flavor:'1世紀、ローマ皇帝ネロの時代にギリシア人の軍医ディオスコリデスが著した全5巻の薬物書。約600種の植物を中心に、1000近い薬物の産地・見分け方・調製法・効能を記した。以後1500年にわたり薬草学の標準書とされ、512年ごろの豪華写本「ウィーン・ディオスコリデス」は今も伝わる。'},
       {name:'プリニウス『博物誌』',n:2,flavor:'大プリニウス（23/24〜79）が著した全37巻の百科全書。第20〜32巻で植物と動物に由来する薬を扱う。多くの先行書からの引用を集めたもので、迷信的な記述も少なくない。プリニウスは79年のヴェスヴィオ火山噴火の際、救援に向かい命を落とした。'}],
  ev:{name:'神農', icon:'🌾', type:'A', alpha:.15, quote:'中国古代の伝説上の帝王で、三皇の一人。農耕を人々に教えた「炎帝」とも同一視される。前漢の『淮南子』には、百草の味を自ら試し、一日に七十もの毒にあたったという話がある。実在は確認できない人物だが、漢代ごろに成立した薬物書『神農本草経』は彼に仮託され、365種の薬を上品・中品・下品に分類した。原本は失われ、後世の引用から復元されている。日本でも大阪・道修町の少彦名神社は神農を祀り、薬の神として今も薬業者の信仰を集める。'}},
 {id:'shinden', name:'神殿', icon:'🏛️', x:140,y:190, baseCost:120, baseProd:1, unlockAt:300,
  flavor:'古代ギリシアでは医神アスクレピオスの神殿が治療の場となり、患者は神殿に泊まって夢の中の啓示を待った。同じころヒポクラテス派は、病を神罰ではなく自然の現象として観察する道を開く。ギリシア語の「ファルマコン」は薬と毒の両方を意味し、量が両者を分けるという考えが、のちの薬学の出発点となった。',
  ups:[{name:'ヒポクラテス医学全集',n:0,flavor:'紀元前5〜4世紀ごろに成立した約60編の文書群で、ヒポクラテス本人の著作かは分かっていない。『神聖病について』はてんかんを神の仕業とする説を退け、『空気、水、場所について』は気候や土地と病気の関係を論じる。観察と記録を重んじる姿勢が、のちの西洋医学の基礎となった。'},
       {name:'ガレノスの薬物調合書',n:1,flavor:'2世紀、ペルガモン出身のガレノス（129ごろ〜216ごろ）は剣闘士の医師を経てローマで皇帝の侍医となり、薬物の調合と抽出の方法を体系化した。植物などを原料とする製剤は今も「ガレヌス製剤」と呼ばれ、製剤学にその名を残す。水・蝋・オリーブ油から作る冷膏（コールドクリームの原型）も彼の考案とされる。'},
       {name:'四体液説の医学理論書',n:2,flavor:'血液・粘液・黄胆汁・黒胆汁の4つの体液の均衡が健康を保ち、乱れが病を招くという説。ヒポクラテス全集の『人間の自然性について』に見られ、ガレノスが四元素や気質、薬の温・冷・乾・湿の性質と結びつけて体系化した。偏りを反対の性質の薬で正すという考え方は、その後1500年にわたり西洋医学の枠組みとなった。'}],
  ev:{name:'ヒポクラテス', icon:'🧑‍⚕️', type:'B', quote:'紀元前460年ごろ、コス島に生まれたとされるギリシアの医師。同時代の記録はプラトンやアリストテレスの言及などごくわずかで、生涯の詳細は分かっていない。「医学の父」と呼ばれるのは、病を神罰でなく自然の原因から説明し、観察と記録を重んじる医学の流れを象徴する存在だからで、『ヒポクラテス全集』の多くは弟子や後世の著者によるものとされる。全集の『箴言』冒頭の一節「人生は短く、術は長い」は特に名高い。医師の倫理を説く「ヒポクラテスの誓い」も全集に含まれ、現代の医療倫理の源流とされるが、本人の作かは定かでない。'}},
 {id:'shudo', name:'修道院', icon:'🌳', x:230,y:320, baseCost:1440, baseProd:10, unlockAt:3400,
  flavor:'6世紀にベネディクト会が広まると、修道院は病者の世話を務めとし、診療所と薬草園を備えた。9世紀前半の「サンクト・ガレン修道院の理想平面図」には薬草園が描かれ、セージやヘンルーダなど16種の薬草が植えられている。写本を作る修道士たちは、古代の医学書を後の世へ書き継いだ。',
  ups:[{name:'ベネディクト会戒律書',n:0,flavor:'ヌルシアのベネディクトゥスが6世紀前半に定めた修道会則。第36章は病者の世話を何よりも優先すべきものと定め、修道院に病者を受け入れる施設と薬草園が整う土台となった。有名な標語「祈り、働け」は後世のもので、戒律書そのものの文言ではない。'},
       {name:'ヒルデガルト『フィジカ』',n:1,flavor:'ビンゲンのヒルデガルト（1098〜1179）はベネディクト会の女子修道院長。12世紀半ばの『フィジカ』は全9巻で、植物の巻だけで約230項目、ほかに元素・樹木・石・魚・鳥・獣・爬虫類・金属を扱う。薬効を温・冷・湿・乾の性質で説明し、ドイツ語の植物名も記す。ただし現在「ヒルデガルト療法」と呼ばれるものには後世の付加が多い。'},
       {name:'疑アプレイウス本草書',n:2,flavor:'『ヘルバリウム』とも呼ばれる、4〜5世紀ごろのラテン語薬草書。古代ローマの作家アプレイウスに帰されたため、偽アプレイウスと呼ばれる。約130種の薬草の効能と用い方を短く記し、中世を通じて数多くの挿絵入り写本が作られた。11世紀には古英語にも訳されている。'}],
  ev:{name:'ヒルデガルト・フォン・ビンゲン', icon:'🌿', type:'A', alpha:.15, quote:'1098年ごろ、ライン川流域の貴族の家に生まれたとされるベネディクト会の修道女。幼くして修道院に託され、のち女子修道院長となり、ビンゲン近郊にルーペルツベルク修道院を開いた。幻視を記した『スキヴィアス』、聖歌の作曲、皇帝や教皇との書簡など、活動は多方面に及ぶ。自然の生命力を表す「ヴィリディタス（緑の力）」は彼女の思想を象徴する語。医学・自然学の書『フィジカ』と『病因と治療』の成立には弟子の関与も指摘される。2012年に教会博士に列せられた。'}},
 {id:'salerno', name:'サレルノ医学校', icon:'📚', x:150,y:450, baseCost:17280, baseProd:100, unlockAt:12000,
  flavor:'南イタリアのサレルノは、ギリシア・ラテン・アラビア・ユダヤの文化が交わる港町で、11世紀ごろに医学の中心として名声を得た。女性の医師も活動していたとされる。1231年のメルフィ憲章で、シチリア王でもあった神聖ローマ皇帝フリードリヒ2世は、医師の開業に試験と免許を課し、薬剤師の職分を医師から切り離す規定を設けた（1240年ごろの法令とする説もある）。薬学史上、職能分離の出発点とされる。',
  ups:[{name:'コンスタンティヌス・アフリカヌスの翻訳事業',n:0,flavor:'11世紀後半、北アフリカ出身のコンスタンティヌス・アフリカヌスは、サレルノを経てモンテ・カッシーノ修道院に入り、アラビア語の医学書をラテン語に訳した。『パンテグニ』はアラビア医学の大著の翻訳で、イサク・イスラエリの著作なども訳出。原著者名を伏せた翻案だとして批判も受けたが、西欧にアラビア医学を広く紹介した功績は大きい。'},
       {name:'アンティドタリウム・ニコライ',n:1,flavor:'12世紀ごろにサレルノで編まれた処方集。約140の処方を薬名のアルファベット順に並べ、材料の分量や調製法を記す。中世ヨーロッパの薬局で広く使われ、15世紀後半には印刷本も出た。分量の単位や調剤の作法は、のちの薬局方（ファルマコペア）の原型となった。'},
       {name:'サレルノ養生訓',n:2,flavor:'ラテン語の韻文で書かれた健康の手引き書。食事・睡眠・入浴・感情・季節ごとの過ごし方を、覚えやすい詩の形で説く。12〜13世紀に原型ができ、のち増補を重ねて、版により数百行から数千行に及ぶ。各国語に訳され、近世に至るまでヨーロッパで広く読まれた。'}],
  ev:{name:'トロータ・ディ・サレルノ', icon:'📖', type:'B', quote:'トロータは、12世紀のサレルノで活動した女性の医療者で、実在が確認されている。彼女の名に結びつく『トロトゥーラ』は、女性の月経・妊娠・出産・美容を扱う3つの文書を13世紀ごろにまとめた集成で、3編すべてを彼女が書いたわけではなく、作者には男性を含む複数の人物が想定されている。ラテン語のこの集成は写本が100以上現存し、俗語にも訳されて中世ヨーロッパで広く読まれた。のちの版では著者名が男性形に改められることもあった。'}},

 {id:'alchemy', name:'錬金術', icon:'⚗️', era:2, x:210,y:580, baseCost:207360, baseProd:1000, unlockAt:100000,
  flavor:'8世紀ごろ、イスラム世界で発達した錬金術は、蒸留・昇華・ろ過などの実験技術を大きく発展させた。物質を分解し純粋な成分を取り出す発想は、のちの製薬技術の土台となる。金属を「変成」させる試みは実らなかったが、実験器具と手法は12世紀以降ラテン語訳を通じてヨーロッパへ伝わり、工房は薬品精製の場ともなった。',
  ups:[{name:'ジャービル『七十書』',n:0,flavor:'8世紀後半から9世紀ごろに成立したとされるアラビア語の錬金術文書群。ジャービル・イブン・ハイヤーンに帰されるが、実際には後世の弟子や信奉者らが書き継いだ「ジャービル文書群」とみられる。硫黄と水銀を金属の構成要素とする説や蒸留による精製の手順を記し、後のラテン錬金術に大きな影響を与えた。'},
       {name:'偽ゲーベル『大全』',n:1,flavor:'13世紀末から14世紀初めごろ、ラテン語圏で成立した錬金術書。中世ヨーロッパでは8世紀の錬金術師ジャービル（ラテン名ゲベル）の著作とされたが、現在では別人による作とみられ「偽ゲーベル」と呼ばれる。金属変成の理論とともに、硝酸や王水の製法など実験化学の具体的な手順を記した点で評価が高い。'},
       {name:'ヨハネス・デ・ルペシッサ『第五元素の考察』',n:2,flavor:'1351年ごろ、フランスの錬金術師ヨハネス・デ・ルペシッサが著した書。ワインを繰り返し蒸留して得られるアルコール（命の水）を、天と地を構成する四元素とは別の「第五元素」とみなし、万病を癒す霊薬として医療への応用を説いた。蒸留酒が薬として広まる出発点の一つとされる。'}],
  ev:{name:'ジャービル・イブン・ハイヤーン', icon:'🧙‍♂️', type:'A', alpha:.15, quote:'8世紀後半、イスラム世界で活動したとされる錬金術師・化学者。実在や生涯の詳細には議論があり、彼の名を冠する膨大な著作群（ジャービル文書群）は複数の著者によるものとみられる。硫黄と水銀による金属構成論を説き、蒸留・結晶化・ろ過など実験室での操作を体系的に記録した先駆者として、後世「化学の父」とも呼ばれる。'}},
 {id:'iatro', name:'医化学', icon:'🧪', era:2, x:135,y:710, baseCost:2488320, baseProd:10000, unlockAt:1200000,
  flavor:'16世紀前半、パラケルススは四体液説を退け、病気を体内の化学的な不調ととらえる「医化学（イアトロケミー）」を唱えた。水銀・硫黄・アンチモンなど鉱物を精製して薬とし、量が薬と毒を分けると説いた。過激な主張と反骨精神で正規の医学界と衝突を繰り返したが、その思想は次第に化学と医学を結びつけていく。',
  ups:[{name:'パラケルスス『パラグラヌム』',n:0,flavor:'1529年ごろに執筆されたパラケルススの主著の一つ（生前は未刊）。医学は哲学・占星術・錬金術・徳の4本柱に支えられるべきだと説き、伝統的な学識医学を鋭く批判した。錬金術を金儲けの技ではなく、薬を精製し病を癒すための技術として再定義した点が重要視される。'},
       {name:'パラケルスス『オプス・パラミルム』',n:1,flavor:'1530年代前半に成立したとされるパラケルススの著作。病気は体液の乱れではなく、体内で物質が正しく分離・変化しないことから生じるとする独自の病因論を展開した。鉱物由来の薬を積極的に用いる姿勢を理論面から支え、後の医化学派に受け継がれた。'},
       {name:'ペトルス・セヴェリヌス『イデア・メディキナエ・フィロソフィカエ』',n:2,flavor:'1571年、デンマークの医師ペトルス・セヴェリヌスが著した書。難解で断片的だったパラケルススの思想を整理し、体系立てて紹介した重要な解説書とされる。この本を通じてパラケルスス医学はヨーロッパ各地の医師たちに広まり、次世代の医化学派を育てる土台となった。'}],
  ev:{name:'パラケルスス', icon:'🥼', type:'B', quote:'1493年ごろスイスに生まれ、本名テオフラストゥス・ボンバストゥス・フォン・ホーエンハイム。各地を遍歴し鉱山医として働いた経験から、鉱物と化学に基づく医学を志向した。1527年にバーゼル大学の教授となるが、伝統医学の権威ガレノスの書を公然と燃やす挙に出るなど急進的な言動で敵を作り、教授職は1年余りで終わった。晩年も各地を放浪し、1541年に客死した。「あらゆるものは毒であり、毒でないものはない。用量だけが毒か薬かを決める」という言葉は、現代の薬理学にも通じる考え方として知られる。'}},
 {id:'herbal', name:'本草書', icon:'📗', era:2, x:225,y:840, baseCost:29859840, baseProd:100000, unlockAt:15000000,
  flavor:'活版印刷と木版画の発達により、16世紀のヨーロッパでは精密な植物図を添えた本草書が次々と刊行された。写本の時代とは違い、同じ図版を大量かつ正確に複製できるようになったことで、薬用植物の同定と情報の共有が飛躍的に進む。印刷された本草書は、やがて各地の植物園の整備にもつながっていった。',
  ups:[{name:'フックス『植物誌』',n:0,flavor:'1542年、ドイツの医師レオンハルト・フックスが刊行した本草書。約500種の植物を精密な木版画とともに紹介し、ラテン名・ギリシア名・ドイツ名を併記した。図版の正確さで高く評価され、後世、彼の名にちなんでフクシア属の植物が命名された。'},
       {name:'ヒエロニムス・ボック『新本草書』',n:1,flavor:'1539年、ドイツの牧師で植物学者のヒエロニムス・ボックが刊行した本草書。当時の学者が重んじた古代の権威にあまり頼らず、自ら野山を歩いて観察した植物を記載した点が特徴とされる。初版は図版を持たなかったが、後の版で木版画が加えられた。'},
       {name:'ジョン・ジェラード『本草書』',n:2,flavor:'1597年、イングランドの薬草家ジョン・ジェラードが刊行した英語圏最大級の本草書。自身のロンドンの庭で育てた植物を含む多数の図版を収め、17世紇を通じて版を重ねた。記述には他者の著作からの借用も多いとされるが、英語による本草学の普及に大きく貢献した。'}],
  ev:{name:'レオンハルト・フックス', icon:'🌼', type:'A', alpha:.15, quote:'1501年、ドイツのバイエルンに生まれた医師・植物学者。テュービンゲン大学で医学の教授を務めるかたわら、薬用植物の正確な記載と図版にこだわった本草書づくりに情熱を注いだ。1542年の『植物誌』では、絵師と彫版師の名を著者と並べて記すという当時としては異例の配慮を見せ、図版の正確さへのこだわりがうかがえる。1566年に没した後も彼の本草書は版を重ね、近代植物学の基礎を築いた一人に数えられている。'}},
 {id:'pharma', name:'薬局方', icon:'📐', era:2, x:150,y:970, baseCost:358318080, baseProd:1000000, unlockAt:180000000,
  flavor:'個々の医師や薬局が思い思いに処方をつくっていた時代から、都市や国家が処方と分量を公式に定める「薬局方」の時代へ。同じ薬がどこでも同じ品質で作られることを目指すこの制度は、薬の効果と安全性を保証する仕組みとして、近代の医薬品規制へとつながっていく。',
  ups:[{name:'フィレンツェ『リチェッタリオ』',n:0,flavor:'1499年、フィレンツェの医師薬剤師組合が発行した処方集。都市当局の権威のもとで薬の処方と調製法を公式に定めた最初期の例とされ、世界最古級の公式薬局方に数えられる。以後、他の都市もこれに倣って独自の薬局方を編むようになった。'},
       {name:'コルドゥス『ニュルンベルク薬局方』',n:1,flavor:'1546年、ドイツの植物学者ヴァレリウス・コルドゥスが編み、ニュルンベルク市参事会が公認した薬局方。市内のすべての薬局に強制力を持って適用された点で画期的とされ、日本の薬学史では「世界初の公式薬局方」として紹介されることも多い。'},
       {name:'ロンドン薬局方',n:2,flavor:'1618年、ロンドン薬剤師組合と王立内科医協会が編纂した薬局方。イングランド全土の薬局に適用される国家規模の薬局方として刊行され、以後200年近くにわたり改訂を重ねながら使われ続けた。薬局方が都市単位から国家単位へ広がる転換点となった。'}],
  ev:{name:'ヴァレリウス・コルドゥス', icon:'📋', type:'B', quote:'1515年、ドイツに生まれた植物学者・薬学者。ヴィッテンベルク大学やイタリア各地で学び、各地の植物を実地に観察して記録する旅を重ねた。1546年、ニュルンベルクの医師たちの求めに応じて薬局方の草稿をまとめたが、その翌年、植物採集の旅先で熱病にかかり29歳の若さで没した。彼の死後、友人たちの手で薬局方は出版され、市参事会の公認を得て「ニュルンベルク薬局方」として広まった。エーテルの合成法を記録した人物としても知られる。'}},

 {id:'boyle', name:'実証科学', icon:'🌬️', era:3, x:205,y:1100, baseCost:4299816960, baseProd:10000000, unlockAt:2500000000,
  flavor:'17世紇後半、ロバート・ボイルは錬金術の伝統から一線を画し、実験と観察にもとづく近代化学の出発点を築いた。元素とは何かを問い直し、目に見えない仮説ではなく再現可能な実験結果を重んじる姿勢は、化学を占術的な技芸から実証科学へと変えていく大きな転換点となった。',
  ups:[{name:'ボイル『懐疑的化学者』',n:0,flavor:'1661年刊行。対話形式で書かれたこの書で、ボイルは古代以来の四元素説や錬金術の三原質説を批判し、元素とは実験によってそれ以上分解できないと示された物質であるべきだと論じた。近代的な元素概念の出発点とされる重要な著作。'},
       {name:'ボイルの法則',n:1,flavor:'1662年、気体の体積が圧力に反比例するという関係をボイルが実験で示した。助手ロバート・フックが製作した空気ポンプを用いた実験の成果で、気体の性質を数量的にとらえる先駆けとなり、化学が定量的な学問へ向かう歩みを後押しした。'},
       {name:'ボイル『空気の弾性に関する新実験』',n:2,flavor:'1660年刊行。自作の空気ポンプを使い、真空に近い状態をつくって燃焼や音、生物への影響を調べた実験記録集。実験装置を用いて仮説を検証するという手法そのものを世に示した点で、近代科学の方法論の確立に大きく寄与した。'}],
  ev:{name:'ロバート・ボイル', icon:'👨‍🔬', type:'B', quote:'1627年、アイルランドの貴族の家に生まれた自然哲学者。錬金術にも関心を持ちながら、実験による検証を重んじる姿勢を貫いたことから「近代化学の父」と呼ばれることがある。1660年に発足したロンドン王立協会の設立にも関わった中心人物の一人で、実験結果を仲間内で共有し検証し合うという、今日の科学に通じる共同体のあり方を築くのに貢献した。1691年に没するまで、化学・物理学・神学など幅広い分野で著作を残した。'}},
 {id:'element', name:'元素の発見', icon:'🔥', era:3, x:130,y:1230, baseCost:51597803520, baseProd:100000000, unlockAt:30000000000,
  flavor:'18世紇、燃焼や気体をめぐる実験が各地で盛んになり、それまで知られていなかった元素や化合物が次々と発見されていく。ものが燃えるとは何かという素朴な問いが、当時の常識だった「フロギストン説」への疑いを生み、次の時代の定量的な化学革命への布石となった。',
  ups:[{name:'酸素の発見',n:0,flavor:'1771〜72年ごろ、スウェーデンの薬剤師シェーレは酸化水銀などを加熱する実験から新しい気体を得て「火の空気」と名付けた。だが論文の出版が遅れたため、ほぼ同時期に同じ気体を発見したイギリスのプリーストリーの方が先に発表することになった。'},
       {name:'塩素の発見',n:1,flavor:'1774年、シェーレは軟マンガン鉱に塩酸を反応させる実験で、刺激臭のある黄緑色の気体を得た。当時の理論の枠組みの中では新元素と気づかれず、単なる化合物とみなされていたが、後にこの気体は塩素という元素であることが明らかになった。'},
       {name:'有機酸の単離',n:2,flavor:'シェーレは1770年代を通じて、酒石酸・クエン酸・尿酸・没食子酸など多くの有機酸を果実や動物の排泄物から単離した。生涯に発見した元素・化合物の数は同時代の誰よりも多いとされ、後世「不遇の天才」と呼ばれることもある。'}],
  ev:{name:'カール・ヴィルヘルム・シェーレ', icon:'🧑‍🔬', type:'A', alpha:.15, quote:'1742年、スウェーデンに生まれた薬剤師。正式な大学教育をほとんど受けず、薬局に勤めながら独学と実験を重ねて多くの元素・化合物を発見した。酸素・塩素・窒素・グリセリン・多くの有機酸など、その発見の幅広さは同時代随一とされるが、発表の遅れや所属の弱さから功績の多くを他の研究者に先取りされた。実験中に有害な化学物質を舐めて確かめる習慣があったとも伝えられ、1786年、43歳で亡くなった背景にはこうした化学物質による健康被害があったとの見方もある。'}},
 {id:'lavoisier', name:'定量化学', icon:'⚖️', era:3, x:220,y:1360, baseCost:619173642240, baseProd:1000000000, unlockAt:360000000000,
  flavor:'反応の前後で物質の重さを精密に測るという発想が、化学を質的な技芸から定量的な科学へと変えた。「何も生まれず何も消えない、ただ変化するだけ」という質量保存の考え方のもと、燃焼は物質が失われる現象ではなく酸素と結びつく反応であることが明らかになり、化学は新しい体系へ生まれ変わる。',
  ups:[{name:'ラヴォアジエ『化学命名法』',n:0,flavor:'1787年、ラヴォアジエが仲間の化学者らと編んだ命名法の提案書。元素や化合物に、組成や性質を反映した体系的な名前をつけることを提唱した。それまで錬金術由来の呼び名が入り乱れていた化学に、統一された言葉を与える試みだった。'},
       {name:'ラヴォアジエ『化学原論』',n:1,flavor:'1789年刊行。当時知られていた33の元素を一覧にし、質量保存の法則を軸に化学の全体像を整理した教科書。フロギストン説を排し、酸素による燃焼理論を明快に説いたことで、化学革命を決定づけた一冊とされる。'},
       {name:'質量保存の法則の実証',n:2,flavor:'1770年代、ラヴォアジエは密閉容器の中で金属を加熱する実験を精密な天秤で計測し、燃焼の前後で全体の重さが変わらないことを示した。この地道な計量の積み重ねが、化学反応を数量的に扱う近代化学の方法を確立した。'}],
  ev:{name:'アントワーヌ・ラヴォアジエ', icon:'📏', type:'B', quote:'1743年、パリの裕福な家に生まれた化学者。徴税請負人としての収入を実験設備につぎ込み、精密な天秤を用いた計量にこだわる研究スタイルを確立した。燃焼が酸素との結合であることを示し、フロギストン説を退けて近代化学の基礎を築いたことから「近代化学の父」と呼ばれる。妻マリー＝アンヌも実験記録や図版の作成、外国語文献の翻訳で研究を支えた。だが徴税請負人という立場が災いし、フランス革命下の1794年、50歳で処刑された。'}},
 {id:'alkaloid', name:'アルカロイド抽出', icon:'💊', era:3, x:145,y:1490, baseCost:7430083706880, baseProd:10000000000, unlockAt:4300000000000,
  flavor:'植物には効き目のもとになる成分が含まれているはずだという考えのもと、19世紇初め、その活性成分そのものを植物から取り出す試みが始まる。それまで乾燥させた植物全体を使っていた薬が、純粋な化合物として扱えるようになったことで、薬の量や効き目を正確に管理する道が開けた。',
  ups:[{name:'モルヒネの単離',n:0,flavor:'1804年ごろ、ドイツの薬剤師見習いフリードリヒ・ゼルチュルナーは、阿片から眠りを誘う成分を単離することに取り組んだ。得られた白い結晶を、ギリシア神話の夢の神モルペウスにちなみ「モルヒウム（モルヒネ）」と名付けた。'},
       {name:'ゼルチュルナーの論文発表',n:1,flavor:'1817年、ゼルチュルナーはそれまでの研究成果を学術誌に発表し、モルヒネが植物由来のアルカリ性物質（アルカロイド）であることを広く知らせた。この発表がきっかけとなり、他の研究者たちも植物からのアルカロイド探索に乗り出した。'},
       {name:'アルカロイド抽出の広がり',n:2,flavor:'1820年前後、フランスの薬剤師ペルティエとカヴァントゥがキナ樹皮からキニーネを、コーヒー豆からカフェインを単離するなど、アルカロイドの発見が相次いだ。植物成分を純粋な化合物として扱う流れは、その後の薬理学と製薬化学の土台となった。'}],
  ev:{name:'フリードリヒ・ゼルチュルナー', icon:'🌺', type:'A', alpha:.15, quote:'1783年、ドイツに生まれた薬剤師。薬局の見習いをしながら独学で化学実験を重ね、20歳前後で阿片からモルヒネを単離することに成功した。当初その発見はほとんど注目されなかったが、1817年の論文発表を機に評価が広まり、後にフランス学士院から賞を受けた。彼の仕事は、薬を植物のまま使う時代から、有効成分を単一の化合物として扱う時代への転換点となった。1841年に没した。'}},

 {id:'pharmacol', name:'実験薬理学', icon:'🔬', era:4, x:200,y:1620, baseCost:89161004482560, baseProd:100000000000, unlockAt:52000000000000,
  flavor:'19世紇後半、薬の効き目を経験や観察だけでなく、動物実験によって系統的に調べる「実験薬理学」という新しい分野が確立する。ドイツ・ストラスブール大学に設けられた研究所は世界各国から研究者を集め、その教え子たちが自国に戻って薬理学の講座を開くという形で、この新しい学問は世界へ広まっていった。',
  ups:[{name:'薬理学専門講座の開設',n:0,flavor:'1872年、オスヴァルト・シュミーデベルクはストラスブール大学に世界初とされる薬理学の専門講座を開いた。薬の作用を化学物質として実験的に調べるこの研究所には、各国から多くの若手研究者が学びに訪れた。'},
       {name:'世界初の薬理学専門誌創刊',n:1,flavor:'1873年、シュミーデベルクは病理学者クレープス、臨床医ナウニンとともに実験薬理学の専門誌を創刊した。薬理学の研究成果を発表する場が整ったことで、この分野は独立した学問としての体裁を整えていった。'},
       {name:'『薬理学要綱』',n:2,flavor:'1883年、シュミーデベルクが著した教科書。薬の作用を体系立てて解説したこの本は版を重ね、各国の言葉に訳された。彼のもとで学んだ約120人の弟子のうち、およそ40人が各国で薬理学の教授となり、この教科書を通じて知識が広まった。'}],
  ev:{name:'オスヴァルト・シュミーデベルク', icon:'🎓', type:'B', quote:'1838年、当時ロシア領だったバルト地方に生まれた薬理学者。ドルパット大学で学び、1872年に新設されたストラスブール大学の初代薬理学教授となった。以後42年にわたりこの地位にあり、世界各国から集まった約120人の弟子を育てたことから「実験薬理学の父」と呼ばれる。米国薬理学の礎を築いたアベルや、ロシアの薬理学者クラフコフなど、多くの弟子がそれぞれの国で薬理学の講座を開いた。生涯で14回ノーベル賞候補に挙がったが、受賞には至らなかった。1921年に没した。'}},
 {id:'bacteria', name:'細菌学', icon:'🦠', era:4, x:140,y:1750, baseCost:1069932053790720, baseProd:1000000000000, unlockAt:620000000000000,
  flavor:'病気が目に見えない微生物によって引き起こされるという考え方は、19世紇後半になってようやく実験によって裏付けられる。純粋培養という手法を編み出したことで、どの微生物がどの病気の原因かを一つひとつ特定できるようになり、感染症の正体を突き止める道が開かれた。',
  ups:[{name:'炭疽菌の純粋培養',n:0,flavor:'1876年、ロベルト・コッホは炭疽で死んだ家畜の血液から菌を取り出し、他の菌が混じらない状態で培養する「純粋培養」に成功した。特定の病気と特定の微生物を一対一で結びつけて示した最初期の例とされる。'},
       {name:'結核菌の発見',n:1,flavor:'1882年、コッホは結核患者の組織から結核菌を発見し、この菌が病気の原因であることを示す4つの条件（コッホの原則）を提示した。ある微生物が特定の病気の原因であると証明するための基準として、以後の細菌学に大きな影響を与えた。'},
       {name:'コレラ菌の発見',n:2,flavor:'1883年、コッホはエジプトとインドでの調査からコレラ菌を発見した。水を介して感染が広がる仕組みを示したことで、上下水道の整備など公衆衛生の対策にも科学的な根拠が与えられることになった。'}],
  ev:{name:'ロベルト・コッホ', icon:'🧫', type:'A', alpha:.15, quote:'1843年、ドイツに生まれた医師。田舎町の開業医として働くかたわら、自宅の一室を改造した簡素な実験室で研究を続け、炭疽菌の純粋培養に成功したことで学界の注目を集めた。その後ベルリンの研究機関に招かれ、結核菌やコレラ菌を次々に発見した。1905年、結核に関する研究でノーベル生理学・医学賞を受賞。パスツールとはしばしば学説上のライバルとされ、両者の競い合いが細菌学の発展を大きく加速させた。1910年に没した。'}},
 {id:'serum', name:'血清療法', icon:'💉', era:4, x:230,y:1880, baseCost:12839184645488640, baseProd:10000000000000, unlockAt:7500000000000000,
  flavor:'細菌そのものではなく、感染した動物の血液の中に病気に対抗する力が生まれることが明らかになると、その血清を別の患者に注射して治療するという新しい発想が生まれる。化学物質としての薬ではなく、生体がつくり出す物質を治療に使うこの手法は、免疫学という新しい分野の出発点にもなった。',
  ups:[{name:'ジフテリア抗毒素の発見',n:0,flavor:'1890年、エミール・フォン・ベーリングは、北里柴三郎との共同研究をもとに、ジフテリア毒素を注射した動物の血清に毒素を無力化する力があることを示した。この血清を別の患者に注射する治療法は、多くの子どもの命を救うことになる。'},
       {name:'血清療法の臨床応用',n:1,flavor:'1890年代を通じて、ジフテリア抗毒素は各国で製造され、臨床の現場で広く使われるようになった。馬などの動物に毒素を注射して大量に血清を作る仕組みが整えられ、感染症治療における量産の先駆けとなった。'},
       {name:'第1回ノーベル生理学・医学賞',n:2,flavor:'1901年、フォン・ベーリングは血清療法の確立という功績により、第1回ノーベル生理学・医学賞を単独で受賞した。共同研究者だった北里柴三郎は受賞を逃し、この評価をめぐっては今日でも議論がある。'}],
  ev:{name:'エミール・フォン・ベーリング', icon:'🐴', type:'A', alpha:.15, quote:'1854年、ドイツに生まれた医師・細菌学者。軍医として働いた後、ベルリンでコッホのもとに移り、北里柴三郎らとともに感染症の研究に取り組んだ。1890年、ジフテリアと破傷風の血清療法を発表し、大きな反響を呼んだ。この功績により1901年に第1回ノーベル生理学・医学賞を受賞したが、共同研究者だった北里の貢献をめぐっては当時から議論があった。晩年は製薬会社の設立にも関わり、1917年に没した。'}},
 {id:'chemo', name:'化学療法', icon:'🎯', era:4, x:150,y:2010, baseCost:154070215745863680, baseProd:100000000000000, unlockAt:90000000000000000,
  flavor:'血清療法が生体の力を利用するのに対し、特定の病原体だけを狙い撃ちする化学物質を人工的に合成しようという発想が20世紇初めに生まれる。無数の化合物を体系的に合成しては効果を試すという地道な探索の末に、病原体だけを撃ち抜く「魔法の弾丸」という考え方が現実のものとなった。',
  ups:[{name:'側鎖説と受容体の概念',n:0,flavor:'1900年前後、パウル・エールリヒは、細胞の表面にある特定の構造（側鎖）に薬や毒素が鍵と鍵穴のように結びつくという「側鎖説」を提唱した。これは後の受容体という概念の原型となり、薬がなぜ効くのかを説明する理論的な土台を築いた。'},
       {name:'サルバルサンの開発',n:1,flavor:'1910年、エールリヒと秦佐八郎は、梅毒の病原体だけに作用するヒ素化合物「サルバルサン（合成606号）」を発表した。600種以上の化合物を合成しては動物実験で効果を確かめるという地道な探索の末に生まれた、世界初の合成化学療法剤とされる。'},
       {name:'化学療法指数の考案',n:2,flavor:'エールリヒは、薬が病原体を殺す力と、宿主である人体を傷つける力の比率を数値化する「化学療法指数」という考え方を提唱した。効き目と副作用のバランスを定量的に評価するこの発想は、後の医薬品開発における安全性評価の先駆けとなった。'}],
  ev:{name:'パウル・エールリヒ', icon:'🔴', type:'B', quote:'1854年、ドイツに生まれた医師・細菌学者。染色技術を駆使して細胞や微生物を選択的に染め分ける研究から出発し、特定の病原体だけに作用する物質を人工的に作れるはずだという発想にたどり着いた。600番台を超える化合物を体系的に合成・試験する研究体制を築き、1910年にサルバルサンの発表にこぎつけた。この成果は「魔法の弾丸」という言葉とともに広く知られ、化学療法という分野を切り開いた。1908年にノーベル生理学・医学賞を受賞し、1915年に没した。'}},

 {id:'antibiotic', name:'抗生物質', icon:'🍄', era:5, x:210,y:2140, baseCost:1848842588950364160, baseProd:1000000000000000, unlockAt:1100000000000000000,
  flavor:'カビや微生物どうしが互いの増殖を妨げ合う現象は、20世紇初めから断片的に報告されていた。ある偶然の観察をきっかけに、微生物が作り出す物質を薬として利用する「抗生物質」という考え方が生まれ、それまで治療の手立てがなかった細菌感染症の多くが、初めて治せる病気になっていく。',
  ups:[{name:'ペニシリンの発見',n:0,flavor:'1928年、アレクサンダー・フレミングは、旅行から戻ると実験室に置きっぱなしだった培養皿にアオカビが生え、その周りだけ細菌が増えていないことに気づいた。このアオカビが分泌する物質を「ペニシリン」と名付け、論文で報告した。'},
       {name:'フローリーとチェインによる実用化',n:1,flavor:'1940年代、ハワード・フローリーとエルンスト・チェインの研究チームは、フレミングの報告からほぼ埋もれていたペニシリンを取り上げ、有効成分を精製して動物実験・臨床試験にこぎつけた。フレミングを含む3人は1945年にノーベル賞を受賞した。'},
       {name:'戦時下の大量生産',n:2,flavor:'第二次世界大戦中、アメリカの製薬企業と研究機関が協力し、深部発酵という手法によってペニシリンの大量生産体制を確立した。それまで実験室レベルだった抗生物質が、戦場や一般の医療現場で使える医薬品として一気に普及した。'}],
  ev:{name:'アレクサンダー・フレミング', icon:'🔬', type:'A', alpha:.15, quote:'1881年、スコットランドに生まれた細菌学者。第一次世界大戦で従軍医として負傷兵の感染症治療にあたった経験から、既存の消毒薬の限界を痛感していた。1928年の偶然の観察からペニシリンを発見したが、当時は化合物として抽出・精製する技術がなく、その意義は長らく見過ごされていた。1940年代にフローリーらの研究によって実用化が進むと再び注目を浴び、1945年にノーベル生理学・医学賞を受賞した。1955年に没した。'}},
 {id:'molbio', name:'分子生物学', icon:'🧬', era:5, x:135,y:2270, baseCost:22186111067404369920, baseProd:10000000000000000, unlockAt:13000000000000000000,
  flavor:'生命の設計図がどのような物質に、どのような形で書き込まれているのかという問いに、20世紇半ばついて答えが出る。遺伝情報を担うDNAの構造が明らかになったことで、病気の原因を分子のレベルで理解し、薬を設計するという発想が現実味を帯びていく。',
  ups:[{name:'X線回折写真51番',n:0,flavor:'1952年、ロザリンド・フランクリンと大学院生レイモンド・ゴスリングは、DNA繊維に X線を当てて得られる回折像の中でも特に鮮明な「写真51番」を撮影した。この画像がDNAのらせん構造を強く示唆する決定的な手がかりとなった。'},
       {name:'DNA二重らせん構造の発表',n:1,flavor:'1953年、ジェームズ・ワトソンとフランシス・クリックは、フランクリンのX線回折データや他の研究者の知見を踏まえ、DNAが2本の鎖がらせん状に絡み合った構造をとるという模型を発表した。この構造は、遺伝情報がどのように複製されるかを合理的に説明した。'},
       {name:'セントラルドグマの提唱',n:2,flavor:'1958年、クリックは遺伝情報がDNAからRNAへ、RNAからタンパク質へと一方向に伝わるという原則を「セントラルドグマ」として提唱した。この枠組みは分子生物学の基本的な考え方として広く受け入れられ、以後の研究の土台となった。'}],
  ev:{name:'ワトソン＆クリック', icon:'🧬', type:'B', quote:'アメリカ出身のジェームズ・ワトソンとイギリス出身のフランシス・クリックは、1951年にケンブリッジ大学で出会い、DNAの構造解明を競い合った。1953年、ロザリンド・フランクリンが撮影したX線回折写真や、モーリス・ウィルキンスから得た情報などをもとに、DNAの二重らせん構造を発表した。1962年、ワトソン・クリック・ウィルキンスの3人はノーベル生理学・医学賞を受賞したが、フランクリンは1958年に37歳で病没しており、受賞の対象からは外れた。近年、彼女の貢献の大きさが改めて評価されている。'}},
 {id:'genetic', name:'遺伝子組み換え技術', icon:'✂️', era:5, x:225,y:2400, baseCost:266233332808852439040, baseProd:100000000000000000, unlockAt:160000000000000000000,
  flavor:'DNAの構造がわかっただけでなく、それを人の手で切り貼りできるようになると、医薬品の作り方そのものが一変する。細菌に人間の遺伝子を組み込み、必要なタンパク質を細菌自身に作らせるという発想は、動物や人体から抽出するしかなかった医薬品を、工業的に生産できる時代への扉を開いた。',
  ups:[{name:'コーエン・ボイヤー実験',n:0,flavor:'1973年、スタンリー・コーエンとハーバート・ボイヤーは、制限酵素で切り出した遺伝子を細菌のプラスミドに組み込み、その細菌に目的のタンパク質を作らせることに成功した。遺伝子組換え技術の最初の実証例とされる、分子生物学史上の画期的な実験だった。'},

    const order={ready:0,locked:1,bought:2,teaser:3};
    items.sort((a,b)=>order[a.s]-order[b.s]);
    items.forEach(({g,u,i,s})=>{
      const cost=upCost(g,i);
      const tz=s==='teaser';
      const label = tz ? '🔒<br>💊'+fmt(cost) : s==='bought' ? '獲得済み' : s==='ready' ? 'ロック解除<br>💊'+fmt(cost) : upLockShort(g,i);

        <div class="info" ${tz?'':`onclick="selectItem('up','${g.id}',${i})"`}><div class="nm">${tz?'？？？':u.name}</div><div class="ef">${tz?'？？？':g.name+' +50%'}</div></div>
        <button class="act" id="pu-btn-${g.id}-${i}" ${s==='ready'?`onclick="buyUp('${g.id}',${i})"`:'disabled'}>${label}</button></div>`;
    });
  } else if(panelTab==='ev'){
    PEOPLE.filter(p=>evState(p)!=='locked').forEach(p=>{
      const s=evState(p);

      h+=`<div class="row ${s==='locked'?'locked':''}" id="prow-e-${p.pid}"><div class="ic" onclick="onEvRow('${p.pid}')">${s==='locked'?'❔':iconHTML('ev:'+p.pid,p.icon)}${s==='new'?'<span class="rbadge">NEW</span>':''}</div>
        <div class="info" onclick="onEvRow('${p.pid}')"><div class="nm">${s==='locked'?'？？？':p.name}</div><div class="ef" id="pe-eff-${p.pid}"></div></div>
        <button class="act" id="pe-btn-${p.pid}" ${s==='new'?`onclick="onEvRow('${p.pid}')"`:'disabled'}>${label}</button></div>`;
    });
  } else {
    const arr=[];
    GENS.forEach(g=>{
      g.ups.forEach((u,i)=>{ if(upState(g,i)==='locked') return; const m=TL['up:'+g.id+':'+i]; arr.push({kind:'up',g,i,name:u.name,icon:'📜',ik:'up:'+g.id+':'+i,year:m[0],key:m[1],got:upBought[g.id][i],st:upBought[g.id][i]?'got':'off'}); });
      PEOPLE.filter(p=>p.gid===g.id&&evState(p)!=='locked').forEach(p=>{ const m=TL['ev:'+p.pid], es=evState(p);
        arr.push({kind:'ev',g,p,name:es==='locked'?'？？？':p.name,icon:es==='locked'?'❔':p.icon,ik:es==='locked'?null:'ev:'+p.pid,year:m[0],key:m[1],got:es==='found',st:es}); });
    });
    arr.sort((a,b)=>a.key-b.key);
    const got=arr.filter(x=>x.got).length;
    document.getElementById('panelTitle').textContent='年表　'+got+' / '+arr.length;
    let era='';
    arr.forEach(it=>{
      const BUCKETS=[[500,'古代（〜5世紀）'],[1300,'中世（6〜13世紀）'],[1620,'中世末〜ルネサンス（14〜17世紀前半）'],
        [1700,'近世（17世紀後半）'],[1800,'近代の幕開け（18世紀）'],[1900,'近代（19世紀）'],[Infinity,'現代（20世紀〜）']];
      const e = (BUCKETS.find(b=>it.key<b[0])||BUCKETS[BUCKETS.length-1])[1];
      if(e!==era){ era=e; h+=`<div class="sec">${e}</div>`; }
      const id = it.kind==='ev' ? 'prow-e-'+it.p.pid : 'prow-u-'+it.g.id+'-'+it.i;
      const click = it.kind==='ev' ? `onEvRow('${it.p.pid}')` : `selectItem('up','${it.g.id}',${it.i})`;
      const cat = it.kind==='ev' ? '人物' : it.g.name+'の強化';
      const stTxt = it.kind==='ev' ? (it.st==='found'?'✓ 発見':it.st==='new'?'NEW':'未発見') : (it.got?'✓ 獲得':'未獲得');
      const stCls = it.got ? '' : (it.st==='new' ? 'new' : 'off');
      h+=`<div class="row ${it.got||it.st==='new'?'':'locked'}" id="${id}"><div class="yr">${it.year}</div>

        <div class="info" onclick="${click}"><div class="nm">${it.name}</div><div class="ef">${cat}</div></div>
        <div class="st ${stCls}">${stTxt}</div></div>`;
    });
  }
  if(!h) h='<div class="sec">'+({tree:'',up:'まだ獲得できる強化はありません。生成器を増やすと現れます。',ev:'まだ出会える人物はいません。生成器を50個保有すると出会いがあるかもしれません。',time:'まだ記録はありません。'}[panelTab]||'まだありません。')+'</div>';
  list.innerHTML=h; list.scrollTop=st;
  highlightRow();

}
function updatePanelValues(){

    const ef=document.getElementById('pg-eff-'+g.id), b=document.getElementById('pg-btn-'+g.id);

  });

let infoSel=null;
function prodWith(g,n,m){
  let p=n*g.baseProd*m;
  PEOPLE.forEach(q=>{ if(q.gid===g.id && q.type==='A' && evTriggered[q.pid]) p*=Math.pow(Math.max(n,1),q.alpha); });
  return p;
}
function rowIdOf(s){ return s.kind==='gen' ? 'prow-g-'+s.gid : s.kind==='ev' ? 'prow-e-'+s.gid : 'prow-u-'+s.gid+'-'+s.idx; }

function setT(id,v){ const e=document.getElementById(id); if(e.textContent!==v) e.textContent=v; }
function updateInfoCard(){
  if(!infoSel) return;

      sub = owned[p.gid]<EVENT_OWNED ? '現在 ×'+owned[p.gid]+' / '+EVENT_OWNED : '前提：'+p.need.filter(r=>!metRef(r)).map(refName).join('・'); }
  } else {

    if(st==='locked') sub = upLockText(g,i);
    else if(st==='ready') sub='購入で +'+fmt(prodWith(g,owned[g.id],upMultFor(g)*UP_MULT)-prodOf(g))+'/秒';
  }
  const ih=iconHTML(ikey,icon), ie=document.getElementById('icIcon');

  setT('icCredit',creditOf(ikey));
  setT('icCat',cat); setT('icName',name); setT('icEff',eff);
  setT('icCost',cost); setT('icFlavor',flavor); setT('icSub',sub);
  document.getElementById('icCost').classList.toggle('ok',!!ok);
}

function checkTriggers(){

}

function buy(gid, qty){
  const g=GENS.find(x=>x.id===gid);
  let n = qty==='max' ? maxAffordable(g) : parseInt(qty,10);
  if(!(n>0)) return;
  const cost=bulkCost(g,owned[gid],n);
  if(kp<cost) return;
  kp-=cost; owned[gid]+=n;
  checkTriggers(); rerenderStructure(); refreshSheetIfOpen(gid);
  celebrateGen(gid,n);
}
function buyUp(gid,idx){
  const g=GENS.find(x=>x.id===gid);
  const cost = upCost(g,idx);
  if(upBought[gid][idx] || kp<cost || !upVisible(g,idx)) return;
  kp-=cost; upBought[gid][idx]=true;
  rerenderStructure(); refreshSheetIfOpen(gid);
  celebrateUp(gid,idx);
}

// 骨組みは開いた時／解禁状態が変わった時だけ作り、以降は文字とdisabledだけ更新（タップ中にボタンが作り直されて反応しない問題の対策）

function updateGenSheet(){

  const qn = qtyMode==='1'?1:qtyMode==='10'?10:maxAffordable(g);
  const cost=bulkCost(g,owned[gid],Math.max(qn,0));
  setT('shBuy','購入する（'+qn+'個 / '+fmt(cost)+'）');

function buySheet(){ if(!currentSheet||currentSheet.type!=='gen') return; buy(currentSheet.gid, qtyMode==='max'?'max':qtyMode); }
function setQty(m){ qtyMode=m; updateGenSheet(); }

function openUpSheet(gid,idx){

function updateUpSheet(){
  if(!currentSheet||currentSheet.type!=='up') return;

function refreshSheetIfOpen(gid){ if(!currentSheet||currentSheet.gid!==gid) return; updateSheet(); }
function showSheet(){ document.getElementById('sheet').classList.add('show'); document.getElementById('overlay').classList.add('show'); }

function closeDiscovery(){ document.getElementById('discOverlay').classList.remove('show'); }

function rerenderStructure(){ render(); lastStructureKey=structureKey(); updateLabels(); saveGame(); }
function structureKey(){
  return GENS.map(g=>{
    const un = unlocked(g)?1:0;
    const ups = g.ups.map((u,i)=> (upVisible(g,i)?1:0)+''+(upBought[g.id][i]?1:0)+(upTeaser(g,i)?'t':'')).join('')+(g===nextGen()?'n':'');
    const evs = PEOPLE.filter(p=>p.gid===g.id).map(p=>(evVisible(p)?1:0)+''+((evTriggered[p.pid]&&!evDiscovered[p.pid])?1:0)).join('');
    return un+ups+evs;
  }).join('|');
}
let lastStructureKey='';
/* v19: 画面に見えているノードだけ更新する（IntersectionObserver） */
const visNodes=new Set();
const nodeIO = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){ visNodes.add(e.target); e.target.classList.remove('off'); updNode(e.target); }
    else { visNodes.delete(e.target); e.target.classList.add('off'); }
  });
},{rootMargin:'150px 0px'}) : null;
function observeNodes(){
  visNodes.clear();
  const all=document.querySelectorAll('.node');
  all.forEach(updNode);
  if(!nodeIO) return;
  nodeIO.disconnect();
  all.forEach(n=>nodeIO.observe(n));
}
function updNode(n){
  const m=/^node-up-([a-z0-9_]+)-(\d+)$/.exec(n.id);
  if(m){ const g=GENS.find(x=>x.id===m[1]), i=+m[2]; n.classList.toggle('can', upState(g,i)==='ready' && kp>=upCost(g,i)); return; }
  const g=GENS.find(x=>'node-'+x.id===n.id); if(!g) return;
  const rate=n.querySelector('.rate');
  const t = unlocked(g) ? ('×'+owned[g.id]+'　+'+fmt(prodOf(g))+'/秒') : ('解禁まで '+fmt(g.unlockAt-kpTotal));
  if(rate && rate.textContent!==t) rate.textContent=t;
}
function updateLabels(){
  if(nodeIO) visNodes.forEach(updNode); else document.querySelectorAll('.node').forEach(updNode);
  setT('kpDisp',fmt(kp));
  setT('pRateDisp','+'+fmt(totalProd())+'/秒');
  setT('tapDisp','+'+fmt(tapGain()));
  updatePanelValues();
  updateSheet();
}
function tick(){
  const dt=0.2; const p=totalProd()*dt; kp+=p; kpTotal+=p;
  checkTriggers();
  const key=structureKey();
  if(key!==lastStructureKey){ lastStructureKey=key; render(); }
  updateLabels();
}
const SAVE_KEY='pharma-idle-v1';
function setSavedLabel(t){ const e=document.getElementById('savedAt'); if(e) e.textContent=t; }
function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1,t:Date.now(),kp,kpTotal,lap,cycle,pp,epochs,owned,upBought,evTriggered,evDiscovered}));
    setSavedLabel('💾 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' 保存');
  }catch(e){ setSavedLabel('💾 この環境では保存できません'); }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||d.v!==1) return false;
    kp=Math.max(0,Number(d.kp)||0); kpTotal=Math.max(kp,Number(d.kpTotal)||0);
    lap=Math.min(5,Math.max(1,Math.floor(Number(d.lap)||1))); cycle=Math.max(1,Math.floor(Number(d.cycle)||1)); pp=Math.max(0,Math.floor(Number(d.pp)||0)); epochs=d.epochs||{};
    GENS.forEach(g=>{
      owned[g.id]=Math.max(0,Math.floor(Number(d.owned&&d.owned[g.id])||0));
      const ub=d.upBought&&d.upBought[g.id];
      upBought[g.id]=g.ups.map((u,i)=>!!(ub&&ub[i]));
    });
    PEOPLE.forEach(p=>{ evTriggered[p.pid]=!!(d.evTriggered&&d.evTriggered[p.pid]); evDiscovered[p.pid]=!!(d.evDiscovered&&d.evDiscovered[p.pid]); });
    return true;
  }catch(e){ return false; }
}
let resetArmed=false, resetTimer=null;

  clearTimeout(resetTimer); resetArmed=false; b.textContent='セーブを消去';
  kp=0; kpTotal=0; lap=1; cycle=1; pp=0; epochs={}; epKey="";

  closeSheet(); closeInfoCard(); closeDiscovery();

}

const fx=document.getElementById('fx');
const reduceMotion=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastPtr={x:0,y:0,t:0};
document.addEventListener('pointerdown',e=>{ lastPtr={x:e.clientX,y:e.clientY,t:performance.now()}; },true);
const COL_GEN=['#4be8ac','#b8ffe6','#fff7c2'], COL_UP=['#ffb238','#ffe08a','#ffffff','#ff8a3d'];
function burst(x,y,o){
  if(reduceMotion || fx.childElementCount>140) return;
  const {count=12,radius=46,colors=COL_GEN}=o||{};
  const els=[], f=document.createDocumentFragment();
  const ring=document.createElement('div'); ring.className='fxring';
  ring.style.cssText=`left:${x}px;top:${y}px;--c:${colors[0]}`; els.push(ring); f.appendChild(ring);
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count+Math.random()*.7, r=radius*(.55+Math.random()*.65);
    const el=document.createElement('div'); el.className='spk';
    el.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px;`+
      `--s:${(6+Math.random()*9).toFixed(1)}px;--c:${colors[i%colors.length]};--t:${(.65+Math.random()*.5).toFixed(2)}s;animation-delay:${(Math.random()*.09).toFixed(2)}s`;
    els.push(el); f.appendChild(el);
  }
  fx.appendChild(f);
  setTimeout(()=>els.forEach(e=>e.remove()),1400);
}
// 円の中心座標。他の要素（シート・ヘッダー等）に隠れている時は null
function visibleCenter(id){
  const n=document.getElementById(id); if(!n) return null;
  const c=n.querySelector('.circle')||n; const r=c.getBoundingClientRect();
  const x=r.left+r.width/2, y=r.top+r.height/2;
  const top=document.elementFromPoint(x,y);
  return (top && n.contains(top)) ? {x,y} : null;
}
function popNode(id){ const n=document.getElementById(id); if(n) n.classList.add('pop'); }
function fingerBurst(o){ if(performance.now()-lastPtr.t<1500) burst(lastPtr.x,lastPtr.y,o); }
function celebrateGen(gid,n){
  const big=n>=10, id='node-'+gid;
  popNode(id);
  const c=visibleCenter(id);
  if(c) burst(c.x,c.y,{count:big?20:12,radius:big?60:46,colors:COL_GEN});
  fingerBurst({count:c?6:(big?14:10),radius:34,colors:COL_GEN});
}
function celebrateUp(gid,idx){
  const id='node-up-'+gid+'-'+idx;
  popNode(id);
  const c=visibleCenter(id);
  if(c) burst(c.x,c.y,{count:22,radius:56,colors:COL_UP});
  fingerBurst({count:c?8:16,radius:40,colors:COL_UP});
}

function spawnFloat(x,y,text){
  const el=document.createElement('div');
  el.className='float-plus'; el.textContent=text;
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),700);
}
document.querySelector('.app').addEventListener('click', e=>{
  if(e.target.closest('.node, button, nav, header')) return;
  if(infoSel) closeInfoCard();
  const gain=tapGain(); kp+=gain; kpTotal+=gain;
  spawnFloat(e.clientX, e.clientY, '+'+fmt(gain));
  checkTriggers();
  updateLabels();
});

</script>
